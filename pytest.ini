[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = kitchen/tests
python_files = test_*.py
# Browser tests are slower and need Chrome: run them with  pytest -m e2e
addopts = -m "not e2e" -p no:cacheprovider
markers =
    e2e: real-browser tests (run with: pytest -m e2e)
filterwarnings =
    ignore::DeprecationWarning
